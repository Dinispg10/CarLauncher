# Cria o APK sozinho e publica-o como "Release" sempre que há alterações no ramo main.
# O rádio procura aqui as atualizações (Definições do launcher → Procurar atualizações).
name: Criar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Número da versão
        run: |
          echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=4.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Preparar a chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta o segredo KEYSTORE_BASE64 (ver LEIA-ME, secção Atualizações)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Compilar
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk CarLauncher.apk

      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: b${{ env.VERSION_CODE }}
          name: Versão ${{ env.VERSION_NAME }}
          body: ${{ github.event.head_commit.message || 'Atualização' }}
          files: CarLauncher.apk
          make_latest: true
